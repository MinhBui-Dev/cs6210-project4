syntax = "proto3";

package masterworker;


service worker{
    rpc requestWork (workRequest) returns (workResponse) {}
}

message workRequest{
    string requestType = 1;
    repeated File shard = 2;
    string userID = 3;
    int32 rPartition = 4;
    string outputDir = 5;
}
message File{
    string filePath = 1;
    int32 startOffset = 2;
    int32 endOffset = 3;
}

message workResponse{
    bool status = 1;
    repeated string outputfile = 2;
}